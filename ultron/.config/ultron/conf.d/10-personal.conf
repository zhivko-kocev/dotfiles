# Personal ultron settings; ~/.config/ultron/ultron.conf (this machine) wins over them.

# Everyday browser: Chrome keeps the restored profile and its logins.
BROWSER=google-chrome-stable
# The projects SSD, mounted on every boot (skipped when absent).
MOUNTS=LABEL=projects:/mnt/projects
# LocalSend needs its port open for incoming transfers.
FIREWALL_ALLOW="53317/tcp 53317/udp"
